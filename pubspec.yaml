name: ciftlik_yonetim
description: "Modern Çiftlik Yönetim Sistemi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.8.4

  # Local Storage / Offline
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2

  # File & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path: ^1.9.0
  permission_handler: ^11.3.1
  open_filex: ^4.6.0
  flutter_pdfview: ^1.4.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  http: ^1.2.2
  geolocator: ^13.0.2

  # Forms
  reactive_forms: ^17.0.1

  # Date
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - shorebird.yaml
